<!-- SK FITNESS - PERMANENT FIX - SINGLE FIREBASE - ADMIN ONLY -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
(function(){
  var DB_URL = "https://sk-fitness-zone-default-rtdb.asia-southeast1.firebasedatabase.app/";
  var DB_PATH = "sk_fitness/live";
  var db;
  try{
    if(!firebase.apps.length) firebase.initializeApp({databaseURL: DB_URL});
    db = firebase.database();
    console.log("✅ SK FITNESS PERMANENT SYNC - FIXED");
  }catch(e){ console.log("FB init fail", e); return; }

  var firstLoad = true;
  var fromFB = false;
  var lastStr = "";

  function saveLocal(data){
    fromFB = true;
    try{
      if(data.plans) localStorage.setItem("sk_membership_plans", JSON.stringify(data.plans));
      if(data.trainers) localStorage.setItem("sk_trainers", JSON.stringify(data.trainers));
      if(data.products) localStorage.setItem("sk_products", JSON.stringify(data.products));
      if(data.settings) localStorage.setItem("sk_settings", JSON.stringify(data.settings));
      if(data.grandMoments) localStorage.setItem("sk_grand_moments", JSON.stringify(data.grandMoments));
      if(data.galleryImages) localStorage.setItem("sk_gallery_images", JSON.stringify(data.galleryImages));
      if(data.videos) localStorage.setItem("sk_videos", JSON.stringify(data.videos));
      if(data.leads) localStorage.setItem("sk_leads", JSON.stringify(data.leads));
    }catch(e){}
    setTimeout(function(){ fromFB = false; }, 1000);
  }

  // Customer ko live dikhao - Firebase se
  db.ref(DB_PATH).on('value', function(snap){
    var data = snap.val();
    if(!data){ firstLoad=false; return; }
    var str = JSON.stringify(data);
    if(firstLoad){
      saveLocal(data);
      lastStr = str;
      firstLoad = false;
      return;
    }
    if(str !== lastStr){
      saveLocal(data);
      lastStr = str;
      var isAdmin = localStorage.getItem("sk_is_admin") === "1";
      if(!isAdmin){
        var lr = sessionStorage.getItem("sk_lr");
        var now = Date.now();
        if(!lr || now - parseInt(lr) > 20000){
          sessionStorage.setItem("sk_lr", now.toString());
          location.reload();
        }
      }
    }
  });

  // Admin detect
  setInterval(function(){
    if(document.body.innerHTML.indexOf("Dashboard")>-1 && document.body.innerHTML.indexOf("Logout")>-1){
      localStorage.setItem("sk_is_admin","1");
    }
  },2000);

  // Sirf Admin hi Firebase pe likh sakta hai - PERMANENT FIX, no revert
  var orig = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function(k,v){
    orig(k,v);
    if(fromFB) return;
    var isAdmin = localStorage.getItem("sk_is_admin") === "1";
    if(!isAdmin) return;
    var map = {"sk_membership_plans":"plans","sk_trainers":"trainers","sk_products":"products","sk_settings":"settings","sk_grand_moments":"grandMoments","sk_gallery_images":"galleryImages","sk_videos":"videos","sk_leads":"leads"};
    if(!map[k]) return;
    try{
      if(v.length > 3500000){ alert("Photo bahut badi hai! 500KB se kam wali photo dalo, nahi to save nahi hoga."); return; }
      var p = JSON.parse(v);
      db.ref(DB_PATH+"/"+map[k]).set(p);
      console.log("✅ ADMIN SAVED PERMANENT: "+k);
    }catch(e){ console.error(e); }
  };
})();
</script>
